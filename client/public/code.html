<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E68A" />
      <stop offset="100%" stop-color="#00A862" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="#0B0F17" />
  
  <!-- Subtle Grid Accent / Precision Lines -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00E68A" stroke-width="1" opacity="0.15" />

  <!-- The "B" & Athletic Body Fusion Symbol -->
  <g transform="translate(136, 106)">
    <!-- Head / Apex of the athlete: Modern geometric dot / energy sphere -->
    <circle cx="56" cy="20" r="18" fill="url(#primaryGrad)" filter="url(#softGlow)" />
    
    <!-- Spine / Vertical Backbone of the "B" (Represents posture, discipline, core strength) -->
    <rect x="42" y="52" width="28" height="248" rx="14" fill="#FFFFFF" />

    <!-- Upper loop of 'B': Represents Chest / Deltoid / Lat curve in dynamic tension -->
    <path d="M70,62 C145,62 188,88 188,138 C188,184 148,202 70,202" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Lower loop of 'B': Represents Torso / Oblique / Powerful Athletic Base -->
    <path d="M70,198 C160,198 206,224 206,276 C206,326 156,350 70,350" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Dynamic Metabolic Pulse / Synergy Line across the waist/apex connecting food & training -->
    <path d="M120,200 L165,200" 
          stroke="#00E68A" 
          stroke-width="8" 
          stroke-linecap="round" />
  </g>
</svg>
