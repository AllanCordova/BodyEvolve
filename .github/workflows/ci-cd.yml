name: CI e CD

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bodyevolve
          POSTGRES_PASSWORD: bodyevolve
          POSTGRES_DB: bodyevolve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodyevolve -d bodyevolve_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_KEY: "base64:LBxcJ3JCOU8u9k9M7xen/BPwP91Pjm2CvHBAN1nPRko="
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bodyevolve_test
      DB_USERNAME: bodyevolve
      DB_PASSWORD: bodyevolve
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Dependências
        run: composer install --no-interaction --prefer-dist

      - name: Pint
        run: vendor/bin/pint --test

      - name: Pest
        run: vendor/bin/pest

  client:
    name: Cliente
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test
